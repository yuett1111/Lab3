<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baking in the Kitchen</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2 id="title">Baking the Cake</h2>
        <div class="sequence">
        <img id="image1" src="images/ingredients.jpg" alt="Ingredients">
        <img id="image2" src="images/kitchen.jpg" alt="Messy kitchen">
        <img id="image3" src="images/cake.jpg" alt="Finished cake">
        </div>

    <p id="text">
        Ingredients become a messy kitchen, and finally a finished cake.
    </p>

    <div class="buttons">
            <button id="bakingButton">Baking Story</button>
            <button id="cleanupButton">Cleanup Story</button>
        </div>
</div>

    <script src="script.js"></script>


    
</body>
</html>
